name: Bug report
description: Report something that is broken or incorrect
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the bug and what you expected instead.
      placeholder: GuardedAgent fails when...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Commands or code that trigger the issue.
      placeholder: |
        1. uv sync
        2. uv run python -m src.cli --actor rep-42 "..."
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS and Python version.
      placeholder: macOS, Python 3.12, uv 0.11.x
    validations:
      required: false
